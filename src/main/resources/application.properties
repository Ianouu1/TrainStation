spring.application.name=TpFilRouge

# --- Source de donnees (MariaDB) ---
# Aucun secret versionne (cf. sujet 7.7) : le mot de passe vient de la variable
# d'environnement DB_PASSWORD, l'utilisateur de DB_USER (valeurs par defaut pour
# un poste de dev XAMPP : root / mot de passe vide).
spring.datasource.url=jdbc:mariadb://localhost:3306/Base_ALTN72
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate ---
# Le schema et les donnees de demo sont fournis par db/create.sql : Hibernate ne
# touche pas a la structure de la base (recreation en quelques secondes via le script).
spring.jpa.hibernate.ddl-auto=none
# Rendu serveur (Thymeleaf) : les vues parcourent des associations chargees a la
# demande (equipement -> station, incident -> prestataire). open-in-view garde la
# session ouverte pendant le rendu et evite les LazyInitializationException.
spring.jpa.open-in-view=true

# --- Pages d'erreur : aucune trace technique a l'ecran (cf. 7.4) ---
# Les messages metier sont affiches par les gestionnaires d'erreurs ; une erreur
# imprevue n'affiche qu'un message generique, le detail reste dans les journaux.
server.error.include-message=never
server.error.include-stacktrace=never
