<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion | TrainStation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body">
            <h1 class="h4 mb-3 text-center">TrainStation</h1>
            <p class="text-muted text-center mb-4">Supervision d'équipements et d'incidents</p>

            <div th:if="${param.erreur}" class="alert alert-danger" role="alert">
                Identifiants invalides. Veuillez réessayer.
            </div>
            <div th:if="${param.deconnecte}" class="alert alert-success" role="alert">
                Vous êtes déconnecté.
            </div>

            <form th:action="@{/connexion}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Identifiant</label>
                    <input type="text" id="username" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
