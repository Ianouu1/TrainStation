<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' | TrainStation'">TrainStation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">TrainStation</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/stations}">Stations</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/historique}">Historique</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/prestataires}">Prestataires</a></li>
            <li class="nav-item" th:if="${estResponsable}">
                <a class="nav-link" th:href="@{/supervision}">Supervision</a>
            </li>
        </ul>
        <span class="navbar-text text-light me-3" th:if="${utilisateurConnecte != null}">
            Bonjour <strong th:text="${utilisateurConnecte.prenom}">Prénom</strong>
            (<span th:text="${utilisateurConnecte.profil.libelle}">profil</span>)
        </span>
        <form th:action="@{/deconnexion}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm" type="submit">Déconnectez-vous</button>
        </form>
    </div>
</nav>
</body>
</html>
