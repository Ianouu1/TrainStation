<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fiche équipement')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${equipement.libelle}">Équipement</h1>
    <dl class="row">
        <dt class="col-sm-3">Référence</dt>
        <dd class="col-sm-9" th:text="${equipement.reference}">REF</dd>
        <dt class="col-sm-3">Type</dt>
        <dd class="col-sm-9" th:text="${equipement.type}">Type</dd>
        <dt class="col-sm-3">État</dt>
        <dd class="col-sm-9" th:text="${equipement.etat}">État</dd>
        <dt class="col-sm-3">Station</dt>
        <dd class="col-sm-9">
            <a th:href="@{/stations/{id}(id=${equipement.station.idStation})}"
               th:text="${equipement.station.nom}">Station</a>
        </dd>
    </dl>

    <a class="btn btn-primary mb-4"
       th:href="@{/equipements/{id}/incidents/nouveau(id=${equipement.idEquipement})}">Déclarer un incident</a>

    <h2 class="h5">Incidents (du plus récent au plus ancien)</h2>
    <table class="table table-sm table-bordered align-middle">
        <thead>
        <tr>
            <th>Ouverture</th>
            <th>Statut</th>
            <th>Description</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="incident : ${incidents}">
            <td th:text="${#temporals.format(incident.dateOuverture, 'dd/MM/yyyy HH:mm')}">date</td>
            <td th:text="${incident.statut}">statut</td>
            <td th:text="${incident.description}">description</td>
            <td>
                <a class="btn btn-info btn-sm"
                   th:href="@{/incidents/{id}(id=${incident.idIncident})}">Détail</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${incidents.isEmpty()}" class="text-muted">Aucun incident pour cet équipement.</p>
</main>
</body>
</html>
