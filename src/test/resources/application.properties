# Profil de test : base H2 en memoire, schema genere depuis les entites JPA.
# Les tests s'executent ainsi sans MariaDB (mvn test / mvn verify sur une copie propre).
spring.datasource.url=jdbc:h2:mem:trainstation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.sql.init.mode=never
